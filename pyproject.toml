[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ris-prescreener"
version = "0.1.0"
description = "Transparent, configurable first-pass screening for RIS files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<4",
  "rispy>=0.10,<1",
  "streamlit>=1.35,<2",
]

[project.scripts]
ris-prescreen = "ris_prescreener.core:main"

[tool.setuptools.packages.find]
where = ["src"]
